apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: boutique-services
  namespace: boutique
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - boutique
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway
          - auth
          - product-service
          - orders
          - order-service
          - user-service
  endpoints:
    - path: /metrics
      interval: 15s
